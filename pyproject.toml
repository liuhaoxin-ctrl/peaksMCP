[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peaksMCP"
version = "0.1.0"
description = "Claude Desktop MCP bridge for natural-language ARPES analysis with Peaks and JupyterLab"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastmcp>=2.14.3",
  "mcp>=1.0.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6",
  "numpy>=1.26",
  "xarray>=2024.10",
  "matplotlib>=3.8",
  "psutil>=5.9",
  "threadpoolctl>=3.5",
  "igor2>=0.5",
  "h5netcdf>=1.3",
  "jupyterlab>=4,<5",
  "ipython>=8",
  "jupyter-core>=5",
  "jupyter-client>=8",
  "ipykernel>=6.25",
  "starlette>=0.37",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
  "build>=1.2",
  "playwright>=1.50",
]

[project.scripts]
peaksMCP = "peaksMCP.cli:main"

[project.entry-points."mcp.servers"]
jupyter_peaks = "peaksMCP.server.jupyter_peaks.mcp_server:JupyterPeaksMCPServer"

[project.entry-points."ipython.extensions"]
peaksMCP = "peaksMCP.server.jupyter_peaks.jupyter_mcp_extension:load_ipython_extension"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["peaksMCP*"]
exclude = ["peaksMCP.extensions.jupyterlab.node_modules*"]
namespaces = false

[tool.setuptools.package-data]
"peaksMCP" = [
  "config/*.yaml",
  "discovery/*.yaml",
  "app/defaults/*.yaml",
  "app/webapp/*.html",
  "app/webapp/*.js",
  "app/webapp/*.css",
  "extensions/jupyterlab/labextension/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "-m", "not e2e"]
markers = [
  "integration: integration tests",
  "e2e: browser or live-kernel tests",
  "slow: long-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/e2e/*.ipynb" = ["I001"]

[tool.coverage.run]
source = ["peaksMCP"]
