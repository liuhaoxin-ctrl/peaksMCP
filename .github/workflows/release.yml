name: Release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: peaksMCP-dist
          path: dist/*
      # The Claude plugin (skills + .mcp.json) is not part of the Python wheel;
      # ship it as its own release artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: peaksMCP-claude-plugin
          path: claude_plugin/
          include-hidden-files: true
          if-no-files-found: error
