name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'peaks-arpes @ git+https://github.com/phrgab/peaks.git'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build JupyterLab extension (and fail on bundle drift)
        run: |
          cd peaksMCP/extensions/jupyterlab
          jlpm install
          jlpm run build:prod
          git diff --exit-code -- peaksMCP/extensions/jupyterlab/labextension
      - run: ruff check peaksMCP tests tools
      - run: pytest -m 'not e2e'
