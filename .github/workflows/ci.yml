name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'peaks-arpes @ git+https://github.com/phrgab/peaks.git@5574127f83b88db4fafe4d13d2e0283310f03534'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build JupyterLab extension
        working-directory: peaksMCP/extensions/jupyterlab
        run: |
          jlpm install
          jlpm run build:prod
      - name: Check frontend bundle drift
        id: check_frontend_bundle
        run: |
          frontend_changes=$(git status --porcelain --untracked-files=all -- peaksMCP/extensions/jupyterlab/lib peaksMCP/extensions/jupyterlab/labextension)
          if [ -n "$frontend_changes" ]; then
            printf '%s\n' "$frontend_changes"
            exit 1
          fi
      - run: ruff check peaksMCP tests tools
      - run: pytest -m 'not e2e'
