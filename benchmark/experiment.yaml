version: 3
id: arpes-foundation-workflow-e2e-v3
title: Autonomous ARPES cut preprocessing

objective: >-
  Measure whether an AI agent can discover, execute, and verify a complete foundational
  ARPES cut/mapping workflow through peaksMCP without task-specific human guidance.

conditions:
  p1:
    label: goal-only
    description: >-
      The agent receives the scientific goal, deliverables, and operational constraints without
      benchmark-provided tool names or execution checkpoints.
  p2:
    label: tool-aware
    description: >-
      The agent receives the same common task plus a semantic map of the five-tool MCP surface and
      explicit execution checkpoints.
  u1:
    label: natural-user observation
    description: >-
      A standalone short request modeled on a real Pi TUI session. It does not append the common
      benchmark recipe and is observational only; it is not part of P1/P2 paired promotion.

default_repetitions: 3
required_conditions: [p1, p2]
randomization:
  unit: paired replicate
  rule: Randomize P1/P2 order within each replicate using the frozen campaign seed.
  concurrency: Trials sharing one peaksMCP audit log must run sequentially.

validity:
  required:
    - one immutable prompt condition
    - prompt hash matches the frozen manifest
    - exact audit byte start and end offsets
    - fresh agent session
    - fresh managed kernel and notebook
    - workspace separated from evaluator material
    - answer key generated only after execution
  skipped_strict_check: failure

isolation:
  required: true
  policy: >-
    The agent may use the peaksMCP MCP surface only. It must not read evaluator files,
    benchmark source, reference products, prior trial artifacts, or another trial's state.
  pi_allowed_tools: [mcp, mcpScript]

approvals:
  policy_actions: []
  assistive_actions:
    - scientific_hint
    - tool_hint
    - retry_instruction
    - manual_code
    - manual_data_edit
  note: >-
    No analysis-result save is expected. The browser harness exists to open JupyterLab and
    maintain the Comm bridge; any unexpected persistence dialog is denied.

primary_endpoint:
  name: strict_success
  definition: >-
    Every strict rubric check passes, required evidence is present, the trial is isolated,
    and no assistive intervention occurred.

promotion:
  minimum_valid_trials_per_condition: 3
  minimum_strict_success_delta: 0.10
  target_checks: [C1_blackbox_load, C2_blackbox_inspect, V6_pxt_cache_reused]
  require_no_safety_regression: true
  require_no_outcome_regression: true
  require_paired_wins_not_less_than_losses: true

release_requirements:
  minimum_independent_cases: 2
  require_holdout_case: true
  note: >-
    BP260623 is the development case. Claims of general workflow automation require at least
    one independently acquired holdout dataset that was not used during optimization.

artifacts:
  grading_evidence:
    - workspace/work.ipynb
    - workspace/output
    - audit byte window
    - evaluator/manifest.json
    - operator/interventions.jsonl
    - operator/approvals.jsonl
  diagnostic_only:
    - agent/stdout.jsonl
    - agent/stderr.log
    - agent/session
