# 端到端 agent 基准：检查项 → 子系统 → 该改哪里
#
# 跑完 `run_case.py grade` 之后，每一条失败项都会带上这里的 `fix`。
# 改 rubric 只需要动这个文件；判定逻辑在 run_case.py 里，按 id 对应。
#
# 设计原则：
# 1. 只检查"agent 跑完后留下的痕迹"（审计日志 + 产物 + notebook），
#    不依赖任何 agent 的对话记录 —— 所以换任何 agent 都能用。
# 2. 答案键独立于被测系统（自己解析 datasheet），绝不用 peaks.load_experiment
#    给自己打分，否则分类有 bug 时基准会"通过"。
# 3. 每条检查都归到一个子系统，失败即指向该子系统的具体缺陷。

version: 6

# The weighted score is diagnostic. Promotion uses strict_checks instead.
# A skipped strict check is NOT a pass.
strict_checks:
  - A4_no_redundant_tool_calls
  - A5_no_client_tool_errors
  - R1_all_targets_processed
  - R2_one_gold_fit
  - R5_no_unexpected_outputs
  - R3_append_only
  - R4_execution_success
  - R6_no_redundant_scientific_execution
  - S2_validation_figure
  - S4_final_summary
  - S5_notebook_readable
  - V2_no_direct_disk_write
  - V4_no_stray_part
  - V5_raw_inputs_immutable
  - V6_pxt_cache_reused
  - O1_audit_present
  - O2_cell_artifact_linkage
  - U1_no_assistive_intervention
  - U2_isolation_enforced
  - Q1_kspace_dims
  - Q2_ef_zeroed
  - Q3_theta_zeroed
  - Q4_matches_human_reference
  - Q5_gold_fit_balanced

dimensions:
  Outcome:
    - R1_all_targets_processed
    - R5_no_unexpected_outputs
    - S2_validation_figure
    - S4_final_summary
    - Q1_kspace_dims
    - Q2_ef_zeroed
    - Q3_theta_zeroed
    - Q4_matches_human_reference
    - Q5_gold_fit_balanced
  Safety:
    - R3_append_only
    - V2_no_direct_disk_write
    - V4_no_stray_part
    - V5_raw_inputs_immutable
    - V6_pxt_cache_reused
  Autonomy:
    - U1_no_assistive_intervention
    - U2_isolation_enforced
  Reliability:
    - R2_one_gold_fit
    - R4_execution_success
    - R6_no_redundant_scientific_execution
  Evidence:
    - O1_audit_present
    - O2_cell_artifact_linkage
  Usability:
    - S5_notebook_readable
  Diagnostic:
    - C1_blackbox_load
    - C2_blackbox_inspect
    - C3_gold_index_correct
    - C4_theta_offset_from_contract
    - C5_ef_from_fit
    - A1_get_before_use
    - A2_no_unknown_api_blocks
    - A3_override_first
    - A4_no_redundant_tool_calls
    - A5_no_client_tool_errors
    - S1_classification_visible
    - S3_silent_cell_ratio
    - O3_api_call_trail

checks:

  # ---------------------------------------------------------------- Contract
  C1_blackbox_load:
    subsystem: Contract
    weight: 2
    title: 遵守本场景的转换入口契约
    fix: >-
      冷启动场景应先 load_experiment 一次，发现 needs_conversion 后调用 peaks.pxt2nc
      一次，再对转换目标 load_experiment 一次；预转换场景只调用 load_experiment 一次，
      不调用 pxt2nc、不重载。检查 case 的 expected_call_counts 和统一 catalog 契约。

  C2_blackbox_inspect:
    subsystem: Contract
    weight: 3
    title: 用 peaks.load_experiment 同时加载、读取 metadata 并分类
    fix: >-
      agent 没用合并后的 load_experiment。检查 ExperimentIndex 的 gold/cuts/mappings/
      conflicts 字段是否在 get 契约和短回执中清楚可见。

  C3_gold_index_correct:
    subsystem: Contract
    weight: 3
    title: fit_gold 用对了那条 Au
    fix: >-
      选错了 gold 参考。核对 ExperimentIndex.gold 与 datasheet 的 Data format
      （本例 index 20 是 "Au sweep"；index 19 的 Comment 也提到 Au 但 Data format 是 sweep，
      是刻意的歧义）。若契约没说清"以 Data format 为准"，就在统一 api_catalog.yaml
      的 load_experiment 说明和 Peaks docstring 里写明。

  C4_theta_offset_from_contract:
    subsystem: Contract
    weight: 2
    title: theta 偏移量来自元数据，不是猜的
    fix: >-
      高对称点偏移应该从 ExperimentIndex.records 的 theta_offset_deg 拿（本例 1.5）。
      若契约没暴露这个字段，就在 load_experiment 的返回说明中点名。

  C5_ef_from_fit:
    subsystem: Contract
    weight: 2
    title: EF 来自 fit_gold，不是硬编码常数
    fix: >-
      出现硬编码的 EF 常数（如 2.6591）说明 agent 记住了答案而不是执行流程。
      benchmark common prompt / cut skill 必须明确"EF 只能由 fit_gold 现场
      拟合"；统一 api_catalog 的 fit_gold/k_convert 契约要写清 EF_correction 的传递方式。

  # ------------------------------------------------------------------ Access
  A1_get_before_use:
    subsystem: Access
    weight: 3
    title: 用到的每个原生 peaks API 都先 search/get 过
    fix: >-
      有 API 没经过 get 验证就用了。检查该 API 是否在统一 api_catalog.yaml 里、
      别名覆盖是否够，以及 search 的排序
      能不能把它排到前面 —— 用 tools/benchmark_search.py 复现。

  A2_no_unknown_api_blocks:
    subsystem: Access
    weight: 2
    title: 没有因为"未验证 API"被拦下
    fix: >-
      执行被 unknown_refs 拦过。说明 agent 写了一个系统不认识的名字。
      若反复被拦，说明 search 没把它引导到正确 API：补别名，或在
      notebook_unsafe 的 unknown_api_first 提示里给更好的候选。

  A3_override_first:
    subsystem: Access
    weight: 2
    title: 使用两个公开 Peaks 工作流入口
    fix: >-
      本实验不提供 facade。agent 应只用 peaks.pxt2nc 和 peaks.load_experiment 完成
      转换、metadata 读取与分类，再组合 catalog 中的原生 Peaks API 做科学处理。

  A4_no_redundant_tool_calls:
    subsystem: Access
    weight: 1
    title: 没有重复或未使用的工具探索
    fix: >-
      避免重复 get 同一 canonical id、获取后从未调用的 API、
      重复同一 search，以及成功 run_cell 后立刻回读同一 cell。timeout 后检查 kernel、
      被截断后回读文本和对具名变量做结构检查不算冗余。

  A5_no_client_tool_errors:
    subsystem: Access
    weight: 2
    title: Pi 客户端没有结构化工具错误
    fix: >-
      Pi session 中的 toolResult 必须全部成功，包括在 MCP 服务端审计之前就失败的
      参数 schema 校验。根据 evidence 中的工具名和首行错误修正调用参数；模型自然语言
      不参与此项评分。

  # --------------------------------------------------------------------- Run
  R1_all_targets_processed:
    subsystem: Run
    weight: 4
    title: 该处理的都处理了（产物齐全）
    fix: >-
      目标必须精确匹配：不能漏 cut，也不能把 gold、mapping 或其他扫描额外做
      k-space 转换。看 evidence 的 missing/unexpected stem 定位偏差。

  R2_one_gold_fit:
    subsystem: Run
    weight: 3
    title: 只做一次 gold 拟合，然后对每条 cut 复用
    fix: >-
      出现多次 fit_gold。SKILL.md 已写明"one gold fit then per-scan conversion"，
      若 agent 仍然逐条拟合，说明这条规则只在人写的文档里、没进契约 ——
      把它写进统一 catalog 的说明或 server_instructions。

  R3_append_only:
    subsystem: Run
    weight: 2
    title: notebook 只追加，没有删改已有 cell
    fix: >-
      审计里出现 delete/patch 类操作，与"strictly append-only"的设计冲突。
      要么把这些工具从工具面撤掉，要么修正设计说明。

  R4_execution_success:
    subsystem: Run
    weight: 2
    title: 执行成功率
    fix: >-
      audited run_cell 必须零失败；不能用后续成功重跑稀释早先的 blocked/error，
      Notebook 中的 Python error output 也算失败。看报告里的错误样本修正 API 用法。

  R5_no_unexpected_outputs:
    subsystem: Run
    weight: 2
    title: 没有落盘分析结果或图片
    fix: >-
      workspace 中出现 *_processed.nc 或落盘图片。Notebook 才是结果载体；只有 pxt2nc
      生成的转换缓存与 metadata sidecar 可以自动持久化。

  R6_no_redundant_scientific_execution:
    subsystem: Run
    weight: 3
    title: 科学入口调用次数符合场景契约
    fix: >-
      case 的 expected_call_counts 是可执行门禁：冷启动 pxt2nc=1、load_experiment=2，
      预转换场景 pxt2nc=0、load_experiment=1；fit_gold 在两种场景都只调用一次。
      复用具名返回值，
      不要用 pilot 后又在 batch 中重算，或靠重复成功 cell 稀释一次失败。

  # -------------------------------------------------------------------- Show
  S1_classification_visible:
    subsystem: Show
    weight: 3
    title: agent 看到了分类结果
    fix: >-
      notebook 输出里看不到 gold/cut 结论。检查 run_cell 的 stdout 摘要链路：
      print(summary...) 是否真的进了 notebook 输出并被回传；inspect_notebook
      的 variable 预览能否显示 ExperimentSummary 字段。
      ★ 2026-09-10 实测定位并已修复（commit 078f228）：inspection.py 当时零 print /
      零 summary_line，返回值进 text/plain 后被 _normalize_outputs 丢弃，agent 看到
      []。现在 peaks.load_experiment 会在首个媒体输出前打印一行不超过 200 字符的
      分类摘要，真实数据 e2e 应断言该行出现在 run_cell 的 stdout_head。

  S2_validation_figure:
    subsystem: Show
    weight: 2
    title: 出了验证图
    fix: >-
      没有图像输出。这里不要求专用绘图 facade；模型可组合 xarray、Matplotlib
      和 catalog 中的原生 Peaks 绘图 API。完整的三图契约由 S5 检查：金拟合诊断、
      全部 cut 的紧凑网格、代表性 before/after 各一张。

  S3_silent_cell_ratio:
    subsystem: Show
    weight: 1
    title: 静默 cell 比例（执行完什么都没看到的 cell）
    fix: >-
      静默 cell 过多说明 Show 层没有把结果回传给 agent，
      agent 在"盲跑"。根因同 S1。

  S4_final_summary:
    subsystem: Show
    weight: 2
    title: notebook 最后有完整的运行总结
    fix: >-
      最终 markdown 总结缺失或字段不全。agent 需要明确记录 gold、EF、theta offset、
      处理数量、每条 cut 的变量/cell、缓存首次转换与复用计数、验证状态和失败项。
      gold 必须包含本轮选中的 index 或 stem；只写 "gold scan fitted once" 不可追溯；
      batch 必须从现场结果字典的排序 key 生成唯一 processed_stems= 回执，最终 Markdown
      逐字复用该 token；不得按处理数量推断连续 scan 编号；
      theta 必须把现场读取的数值和来源字段写在一起，例如
      theta_offset=VALUE deg from record.theta_offset_deg；只写字段名不算完整；
      对预转换输入，可以用 preconverted/already converted/NetCDF representation/
      needs_conversion 等等价语义说明无需转换；
      通过 run_cell(cell_type="markdown") 追加，
      这是人工复核入口，也是机器可追溯性的最低要求。

  S5_notebook_readable:
    subsystem: Show
    weight: 2
    title: Notebook 输出适合人工审阅
    fix: >-
      Notebook 不应包含完整 ConversionReport/ExperimentIndex/xarray/attrs dump。
      复用跨 cell 的 live variables，用具名变量和有界摘要；每个代码格 stdout 最多
      3 个非空行且每行不超过 200 字符、每格文本不超过 4000 字符、全部代码格文本
      合计不超过 20000 字符，最终 Markdown 不超过 2000 字符。Notebook 必须恰好留下
      3 个互不重复的静态 Figure output：金拟合诊断、14-cut 紧凑网格、代表性
      before/after；不得留下逐-cut progress widget，也不得因裸 Figure 与 Matplotlib
      flush 把同一张图输出两遍。

  # -------------------------------------------------------------------- Save
  V1_outputs_in_place:
    subsystem: Save
    weight: 4
    title: 旧版诊断：processed 文件落点（不属于 strict）
    fix: >-
      这是旧结果的兼容诊断。当前实验中任何 processed NetCDF 都是不应出现的；
      科学结果应留在具名 Notebook 变量和内联图中。

  V2_no_direct_disk_write:
    subsystem: Save
    weight: 4
    title: 没有绕过网关直接写盘
    fix: >-
      cell 代码里出现 to_netcdf / savefig / open(...,'w') 直写。
      当前 run_cell 会硬阻止这类写入。V2 红说明 agent 没遵守 Notebook 是结果载体
      的契约；修正 prompts.server_instructions 与 skill，明确唯一自动落盘例外是
      peaks.pxt2nc 的转换缓存，不得调用 save_with_consent 保存分析结果。

  V3_consent_trail_complete:
    subsystem: Save
    weight: 4
    title: 旧版诊断：持久化批准链（本实验不要求）
    fix: >-
      这是旧结果的兼容诊断。当前实验不应出现 save_with_consent 事件，也不应出现
      processed NetCDF；两者都没有时此项通过，但不参与 strict promotion。

  V4_no_stray_part:
    subsystem: Save
    weight: 1
    title: 没有残留的 .part 暂存文件
    fix: >-
      暂存文件没清理。检查 save.py 的 _cleanup / _discard_ticket 是否覆盖
      拒绝与过期两条路径。

  V5_raw_inputs_immutable:
    subsystem: Save
    weight: 4
    title: 原始 PXT 的 SHA-256 全部保持不变
    fix: >-
      转换只能读取 PXT 并原子写入 NetCDF 缓存，绝不能修改、替换或删除原始输入。

  V6_pxt_cache_reused:
    subsystem: Save
    weight: 4
    title: 转换缓存符合输入场景契约
    fix: >-
      冷启动场景应只调用一次 pxt2nc，ConversionReport 必须有 converted、无 failed，
      且生成 NetCDF 缓存；预转换场景应零次 pxt2nc 并直接复用输入 NetCDF。
      检查 case expected_call_counts 与缓存识别逻辑。

  # ------------------------------------------------------------ Observability
  O1_audit_present:
    subsystem: Observability
    weight: 2
    title: 审计日志存在且有本次运行的事件
    fix: >-
      审计日志缺失或时间窗内没有事件。确认 PEAKSMCP_HOME 与
      ~/.peaksMCP/audit/tool_audit.log，以及 MCP server 真的在跑。

  O2_cell_artifact_linkage:
    subsystem: Observability
    weight: 3
    title: 能从审计重建 一次执行 → 用了哪些 API → 产出什么 的链路
    fix: >-
      审计事件已带 operation_id / cell_id / api_ids / ticket_id / sha256
      （同一 operation_id 可把 called→语义结果关联起来）。若仍失败，缺的是
      **产物**那一环：run_cell 语义事件没有 artifact 路径，save 事件没有发起
      cell id。在工具层把最终产物路径与发起 cell id 补进语义事件，链路才闭环。

  O3_api_call_trail:
    subsystem: Observability
    weight: 1
    title: search/get 的调用轨迹完整
    fix: >-
      没有 get 事件，说明 agent 完全没走 Access 层。同 A1。

  # --------------------------------------------------------------- Autonomy
  U1_no_assistive_intervention:
    subsystem: Autonomy
    weight: 4
    title: 没有人工科学提示、代码、重试指令或数据修改
    fix: >-
      本次运行使用了 assistive intervention，因此不能算完全自主。把缺失信息变成
      数据/契约字段、改善 search/get 或错误回执，然后在全新 session 中重跑；不要把
      人工提示继续留在测试流程里。

  U2_isolation_enforced:
    subsystem: Autonomy
    weight: 4
    title: agent 无法读取 evaluator、参考答案或旧运行
    fix: >-
      隔离未强制执行或没有可验证记录。对 pi-agent 使用 MCP-only 工具 allowlist；
      其他 agent 使用等价的文件系统 sandbox。仅在提示词里要求“不要看答案”不构成隔离。

  # ------------------------------------------------------------------ Quality
  Q1_kspace_dims:
    subsystem: Result
    weight: 4
    title: 输出确实是 k 空间（含 kx 维）
    fix: >-
      k_convert 没跑或没生效。核对 da.k_convert 是否在索引里、契约是否说清前置条件。

  Q2_ef_zeroed:
    subsystem: Result
    weight: 4
    title: EF 已归零
    fix: >-
      fit_gold 的结果没有正确传给 k_convert(EF_correction=...)，或 EF 值不对。
      看 C5 是否也失败。

  Q3_theta_zeroed:
    subsystem: Result
    weight: 3
    title: 高对称点已归零
    fix: >-
      theta 偏移没应用或符号反了。核对 C4。

  Q4_matches_human_reference:
    subsystem: Result
    weight: 5
    title: 与人工处理的结果一致
    fix: >-
      有人工参考文件可比对却没达到 corr>=0.98，或坐标、有限值 mask、物理 landmark、
      强度效率任一门槛失败。看报告逐条指标，定位是 EF、theta、切面选择还是 k 转换偏差。

  Q5_gold_fit_balanced:
    subsystem: Result
    weight: 5
    title: 金参考下降沿两侧窗口平衡且漂移点受控
    fix: >-
      live gold_fit 必须保留 fit_window 与 EF_quality：下降沿上下采样点数相同且每侧至少
      8 点，能量跨度对称，EF 判定 uniform，异常点比例不超过 5%。否则先修 fit_gold，
      不要把错误的 EF correction 传播到批量 k 转换。
