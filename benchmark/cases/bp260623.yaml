version: 1
id: bp260623
title: L112 BP260623 cut preprocessing
split: development

paths:
  data_env: PEAKSMCP_BENCH_DATA
  data_default: /Users/haoxin/Documents/实验数据/BP260623/data_netcdf
  datasheet_env: PEAKSMCP_BENCH_DATASHEET
  datasheet_default: /Users/haoxin/Documents/实验数据/BP260623/data/datasheet.csv
  reference_env: PEAKSMCP_BENCH_REFERENCE
  reference_default: /Users/haoxin/Documents/实验数据/BP260623/data_netcdf

parser:
  kind: l112_datasheet
  file_stem_template: BP_{index:04d}
  input_suffixes: [.nc]
  output_template: '{stem}_processed.nc'

staging:
  strategy: copy
  include_suffixes: [.nc]
  exclude_globs: ['*_processed.nc']
  include_datasheet: true

scientific_contract:
  target_kind: cut
  gold_selection: Data format identifies the gold reference; comments are not authoritative.
  theta_offset_source: datasheet note or per-record metadata
  expected_gold_indices: [20]
  expected_theta_offset_deg: 1.5

known_challenge: >-
  Record 19 mentions Au in its comment but is a sweep. Record 20 is the actual gold reference
  because its Data format is Au sweep. This tests metadata-based classification.
