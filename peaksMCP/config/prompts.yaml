# Curated runtime prompt text (single source for the L3 "hidden" layer).
#
# Every model/user-facing string that used to be hardcoded in Python source
# lives here so the wording can be reviewed and edited without touching code.
# Python only reads the values and formats the {placeholders}. Keys are
# semantic; rule ids / audit reasons stay in code.
#
# Consumers:
#   mcp_server.py                    -> prompts.server_instructions
#   tools.py                         -> prompts.interactive_omitted_note
#   backend/notebook_unsafe.py       -> prompts.notebook_unsafe
#   security/code_scanner.py         -> prompts.scanner
#   security/ipython_scanner.py      -> prompts.ipython
#
# Keep every value byte-identical to the wording it replaces unless a wording
# change is the actual intent; several regression tests compare rendered text.
version: 1
prompts:
  # ---------------------------------------------- server-level instructions
  # Delivered on every session through FastMCP server instructions (the most
  # globally visible prompt in the system).
  server_instructions: "Work through the five peaksMCP tools only: search, get, inspect_notebook, run_cell, save_with_consent. Query search and get before writing unfamiliar Peaks code - run_cell requires the canonical id of every exact-name Peaks API to be proven by get first (scope must match; pass api_ids to declare them). Write model-generated Peaks analysis code through run_cell, which verifies every Peaks API reference against the live API index before appending and executing a new cell at the end of the notebook (append-only). Inspect the notebook and variables with inspect_notebook (variables/variable/active_cell/cells/cell targets) and preserve units in every figure. Prefer a peaksMCP plotting facade (plot_batch, plot_validation_pair, show_mapping_slice) over hand-written matplotlib; when raw matplotlib is unavoidable use constrained_layout, DejaVu Sans with mathtext symbols ($k_x$, $E_F$) and English labels, 150 dpi inline and 300 dpi when saving. Figures render inline in the notebook for the user; a rendered run_cell reply carries an 'Inline figure rendered ...' line; raw outputs are never returned twice. run_cell is never a persistence path: cells that write files are blocked - persist results or figures exclusively with save_with_consent (staged bytes + approval card; one variable/file per call) and PXT conversion with convert_experiment. Never claim a file was saved unless the receipt says so and the user approved the card."

  # ------------------------------------------------------------------ tools
  interactive_omitted_note: "Interactive panel/widget rendered in the notebook for the user; it cannot be embedded here. Consider it done and describe the figure to the user."
  mime_omitted_note: "Additional output of this MIME type is rendered in the notebook for the user; the text channel cannot show it. The notebook is the shared record."

  # ------------------------------------------------------- notebook_unsafe
  run_cell_persist_blocked: "Execution blocked: this cell writes a file (savefig / file writers / unclear file mode), and run_cell is never a persistence path. Results persist ONLY through the save_with_consent tool (variables/figures) or convert_experiment (PXT to NetCDF) - both stage the exact bytes and ask for your approval on the save card. Do not retry the write inside a cell."

  # ------------------------------------------------------- notebook_unsafe
  notebook_unsafe:
    index_build_failed: "The Peaks API index could not be built; restart the kernel."
    unknown_api_first: "Execution blocked: unverifiable API reference(s) {names}. None of these resolve to a Peaks API by exact name. Use search to find the correct API (candidates: {suggestions}) or fix the typo. If the receiver is complex (e.g. a function return value), assign it to an intermediate variable first. This name must be fetched with get before it can be used."
    unknown_api_retry: "Execution blocked: these names were already reported as unverifiable this session ({names}) and no successful get has followed. Call search, then get(<canonical id>) once for each name, then resubmit the cell."
    api_check_rule: "Prefer a peaksMCP override API whenever one fits the user's intent; use the native peaks API only when no override applies, and non-Peaks functions only when Peaks has no corresponding API. Unrecognised method names block execution."
    import_not_exported: "Import blocked: {names} cannot be imported from peaks/peaksMCP — not a real export. Use search to find the correct API, or import from a generic library instead."
    star_import_rejected: "Star import from {module} is rejected: importing every name would defeat the API check. Import the names you need explicitly."

  # --------------------------------------------------------- code scanner
  scanner:
    # reflection / smuggling
    ref_getattr_dynamic: "getattr with a dynamic attribute name cannot be verified statically"
    ref_dynamic_attr: "dynamic attribute name passed to {name} cannot be verified statically"
    ref_chain_call: "reflection attribute chain in a call cannot be bounded statically"
    smug_attr_mutation: "attribute mutation on an imported module or reflection object via {name}"
    smug_setattr_dangerous: "setattr storing a dangerous callable ({value_name})"
    smug_attribute_delete: "attribute deletion on an imported module or reflection object"
    smug_hidden_callable: "attribute smuggling: storing a dangerous callable where name tracking cannot follow it"
    # capability sinks
    cap_sandbox_via: "operation outside the analysis sandbox via {name}"
    cap_reflection_via: "reflection through {name}; its effect cannot be bounded statically"
    cap_star_import: "star import from {module} defeats name tracking; import the names explicitly"
    ind_subscript_call: "calling a value fetched through a subscript/container index cannot be tracked statically"
    # files and processes
    file_modifying: "file opened in a modifying mode"
    file_modifying_path: "path opened in a modifying mode"
    file_modifying_indirect: "file opened in a modifying mode via indirect fetch"
    file_mode_unclear: "open() with a non-constant mode; read-only-ness cannot be confirmed — approve only if safe"
    file_mode_unclear_indirect: "open() with a non-constant mode via indirect fetch; read-only-ness cannot be confirmed"
    file_raw_write: "raw-descriptor file write via {name}"
    file_write_consent: "file write via {name}; approve only to write to disk"
    file_write_consent_indirect: "file write via indirect fetch of {target}; approve only to write to disk"
    deserialize_unsafe: "unsafe deserialization via {name}"
    env_mutation: "process environment modification"
    env_mutation_aliased: "process environment modification through an aliased os.environ"
    savefig_consent: "figure save to disk (savefig) is blocked in run_cell: run_cell never persists; use save_with_consent on the figure variable"
    # execution
    exec_dynamic: "dynamic code execution via {name}"
    exec_indirect: "dynamic code execution via indirect fetch of {target}"
    sys_destructive: "system or destructive operation via {name}"
    sys_destructive_indirect: "system or destructive operation via indirect fetch of {target}"
    path_destructive: "destructive path operation via {name}"
    import_dynamic: "dynamic import via {name}"
    network_consent: "network request via {name}; approve only to send data externally"

  # ------------------------------------------------------ ipython scanner
  ipython:
    ipy_shell: "shell escape or indirect IPython command execution"
    ipy_env_magic: "environment or extension modifying IPython magic"
