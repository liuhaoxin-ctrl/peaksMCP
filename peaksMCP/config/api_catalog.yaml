version: 1
# The model-visible peaks surface. Keys are exact discovery canonical IDs.
# Anything found by the dynamic scanner but absent here is hidden by default.
apis:
  top_level:peaks.core.fileIO.experiment:pxt2nc:
    kind: native
    exposure: core
    aliases: [convert pxt, pxt to netcdf, convert raw experiment, PXT转换, 原始数据转换]
    docstring_note: Convert raw PXT data into validated, reusable NetCDF cache files. Keep each report in a named variable and display only report.summary_line(); never print the full report/items list.
  top_level:peaks.core.fileIO.experiment:load_experiment:
    kind: native
    exposure: core
    aliases: [load experiment, inspect experiment, classify scans, preprocess all 2D data, preprocess 2D experiment, 2D cut preprocessing, 加载实验, 读取实验数据, 检查实验, 扫描分类]
    docstring_note: >-
      Call once: `from peaks import load_experiment; exp = load_experiment(source)`.
      Print only `len(exp.gold)`, `len(exp.needs_conversion)`, and
      `len(exp.conflicts)`; no reflection/to_dict. Do not inspect exp after loading
      unless its reply was truncated. Do not search or get pxt2nc unless it is
      non-empty; then convert/reload once. Otherwise say "preconverted cache reused".

      gold/cuts/mappings are index lists; records expose
      index/stem/kind/is_gold/dims/theta_offset_deg/polarisation. Use exact glue:
      `records_by_index = {record.index: record for record in exp.records};
      gold_index = exp.gold[0]; gold = exp[gold_index]; gold_record =
      records_by_index[gold_index]`. Summarize with `gold_record.stem`. Iterate
      `for cut_index in exp.cuts`; bind `record = records_by_index[cut_index]`
      and `raw = exp[cut_index]`.
      ExperimentConflict exposes only index/data_format/dims/issue. For a cut
      conflict with deflector_perp use `.sel(deflector_perp=0.0)`; do not search
      for an additional Peaks extraction API.

      Before any analysis cell, exact-search/get fit_gold,
      assign_normal_emission, and k_convert when not already proven in the
      ledger; never use a blocked run_cell as proof. Use direct search/get calls
      rather than mcpScript. Fit once: `gold_fit =
      gold.fit_gold(show=False, quiet=True)`. Process exactly exp.cuts, never gold,
      mappings, or unsupported records. Each cut calls
      `raw.metadata.assign_normal_emission(theta_par=record.theta_offset_deg)`
      then `zeroed.k_convert(EF_correction=gold_fit, quiet=True)`. The value is on
      the record; the metadata accessor does not expose `raw.metadata.theta_offset_deg`. Save
      `theta_by_stem[record.stem] = record.theta_offset_deg` in the batch and use
      `theta_by_stem[rep_stem]` in labels. Keep one stem-keyed result dictionary
      and print one receipt:
      `print("processed_stems=" + ",".join(sorted(result_dict)))`. Use at most
      three stdout lines of 200 characters.

      Render exactly three static figures once in separate cells: returned gold
      diagnostic, the compact all-cut grid via `peaks.plot_cut_grid(result_dict,
      theta_by_stem)`, and the representative comparison via
      `peaks.plot_before_after(representative_raw, representative_kcut, rep_stem,
      theta_by_stem)` (labels use `theta_by_stem[rep_stem]`). Leave each returned
      Figure as the cell's final expression; the helpers fix the layout in code
      and render once.

      Final Markdown, at most 2000 characters, must name the result dictionary
      and all processed stems. Copy the complete returned `processed_stems=...`
      token verbatim; never infer consecutive stems from the count. Identify
      observed `gold=SELECTED_STEM (index SELECTED_INDEX)`; "gold scan fitted
      once" alone is incomplete. Include only EF, numeric theta, cache,
      validation, and failures. Do not repeat runtime/tool/API guidance. Do not
      hand-type a representative stem; omit it or use the live stem variable. Do
      not reread datasheet or persist processed data or figures.

