    docstring_note: Call only as the bound DataTree method tree.plot_grid(...) and retain the returned compact Figure; do not import or call a bare/module-level plot_grid. A stem-keyed result dictionary is not a DataTree, so use Matplotlib glue for its compact grid and do not get plot_grid for that workflow. Do not create one figure per record.

  top_level:peaks.core.display.plotting:plot_cut_grid:
