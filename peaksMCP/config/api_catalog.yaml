  dataarray:peaks.core.fitting.fit:fit_gold:
    kind: native
    exposure: core
    aliases: [gold reference fit, fit Fermi edge, gold fit, Fermi level fit, 金参考拟合, 金拟合, 费米边拟合, 费米能级拟合]
    docstring_note: >-
      Call exactly once as the bound DataArray method `gold_fit =
      gold.fit_gold(show=False, quiet=True)`, not as an imported module function, and keep
      the returned Dataset. Its attrs contain EF_correction, scalar EF_poly4,
      EF_quality, EF_correction_outlier_count/fraction, average_resolution_eV,
      fit_window and figure. EF_quality and fit_window are mappings, not scalar
      floats: never print either complete mapping or iterate it generically. Read exactly
      fit_window[start_eV/stop_eV/lower_points/upper_points] and
      EF_quality[outlier_fraction/uniform], then print those with EF_poly4 in
      one line under 200 characters. Then assign
      `gold_figure = gold_fit.attrs["figure"]` and leave `gold_figure` as the
      cell's final expression. Do not call display. `show=False` keeps this
      returned Figure closed until that final expression renders it once. The
      receipt must precede the figure so run_cell returns both
      without inspect_notebook. Reuse the same Dataset for every cut and never
      rerun fit_gold.
  dataarray:peaks.core.process.k_conversion:k_convert:
    kind: native
    exposure: core
    aliases: [momentum conversion, k-space, 动量转换, k空间]
    docstring_note: In a notebook batch, pass EF_correction=fit_result_or_mapping and quiet=True directly so one progress widget is not emitted per scan. A converted cut exposes kx or ky (depending on geometry), never k_par; obtain the momentum coordinate from the output dims/coords instead of guessing an alias. For a raw 3D mapping, do not call MDC first; pass eV_slice=(binding_energy_center, total_width) to k_convert so Fermi correction precedes the narrow binding-energy slice and momentum interpolation.
