version: 5
# peaksMCP project API manifest - the model's curated black-box surface.
#
# Exactly six public adapters are registered here; every other peaksMCP
# function (metadata helpers, legacy writers, old task facades) is a private
# implementation and is NOT in this manifest.  Entries are constructed
# statically into the API index (no AST scan of peaksMCP); native peaks APIs
# are the only dynamically scanned tier.  Signatures are verified at runtime
# by importing `export`; get returns this structured contract.
#
# v5: `inputs` is a STRUCTURED list of declared parameters
# ({name, type, required, default?, note?}) instead of free text, so declared
# parameter names are checked against the real signature (a typo or a rename
# fails the schema/invariant tests and the runtime get call).
apis:
  load_data:
    export: peaksMCP.overrides.load_data
    exposure: facade
    aliases:
    - "load data"
    - "load dataset"
    - "load folder"
    - "load experiment"
    - "load pxt"
    - "read pxt"
    - "open dataset"
    - "加载数据"
    - "读取数据"
    - "打开数据"
    - "加载PXT"
    - "读取PXT"
    - "打开PXT"
    - "加载目录"
    - "批量加载"
    - "加载"
    summary: Load any data for the agent - one file, or an identity index of a folder/list.
    inputs:
      - {name: source, type: 'str | Path | list | tuple', required: true, note: 'one .pxt/.nc file, a folder, or a sequence of paths'}
      - {name: lazy, type: bool, required: false, default: false, note: 'true keeps values dask-backed; materialise with da.load() before native numerics'}
      - {name: metadata, type: 'str | Path | dict | None', required: false, default: null, note: 'explicit metadata document for the index'}
    returns: 'peaks DataArray (one file) or LoadedScans (folder/sequence: identity
      index - stem/path/representation/sizes/metadata provenance + scans[stem] data
      layer; no classification)'
    preconditions: path(s) exist; folder contains supported files
    errors: missing path; unsupported suffix; empty folder/sequence
    example: scans = load_data("data/"); summary = inspect_experiment(scans); cut = scans["BP_0015"]
    side_effects: 'creates a DataArray (one file) or LoadedScans variable; prints
      one line; never writes files; raw inputs untouched'
  convert_experiment:
    export: peaksMCP.overrides.convert_experiment
    exposure: facade
    aliases:
    - "convert experiment"
    - "convert scans"
    - "convert experiment folder"
    - "single or batch conversion"
    - "PXT转换"
    - "转换实验"
    - "转换文件或目录"
    summary: Thin PXT-to-NetCDF compatibility boundary under human consent (no
      analysis freedom; one verb repeated per file).
    inputs:
      - {name: source, type: 'str | Path', required: true, note: 'one PXT file or a folder of PXT files'}
      - {name: output_dir, type: 'str | Path | None', required: false, default: null, note: 'destination; defaults to the sibling <folder>_netcdf/'}
      - {name: metadata, type: 'str | Path | None', required: false, default: null}
      - {name: match, type: str, required: false, default: '', note: 'filename substring filter for a folder batch'}
      - {name: overwrite, type: bool, required: false, default: false}
    returns: 'ConversionReport (per-item status/output_exists/errors/warnings);
      never printed - the report object is the outcome'
    preconditions: 'source exists; metadata exists when given; the target
      directory is created only at publish time, after approval'
    errors: source not found; metadata file not found
    example: 'report = convert_experiment("raw/", match="BP_"); report.items'
    side_effects: 'persists converted NetCDF files + translated experiment_metadata.json
      ONLY after approval on the consent card (manifest rows: source -> target with
      dims/dtype/units/warnings); staging in a unified temp area with strict TTL;
      no code-level approve'
  inspect_experiment:
    export: peaksMCP.overrides.inspect_experiment
    exposure: facade
    aliases:
    - "inspect experiment"
    - "experiment summary"
    - "experiment classification"
    - "scan classification"
    - "classify scans"
    - "scan kinds"
    - "which scans are cuts"
    - "检查实验"
    - "实验概览"
    - "扫描分类"
    - "数据分类"
    - "扫描类型"
    - "哪些是cut"
    - "有哪些cut"
    summary: 'Classify one experiment: per-record ScanKind, decision lists and
      shape conflicts (the single classification owner).'
    inputs:
      - {name: experiment, type: 'LoadedScans | str | Path | dict | DataArray', required: true, note: 'primary form: the load_data index; standalone metadata documents are also accepted'}
      - {name: scans, type: 'dict[int | str, DataArray] | None', required: false, default: null, note: 'document-only form: loaded arrays keyed by record index'}
    returns: 'ExperimentSummary (records with ScanKind/dims/energy windows +
      gold/cuts/mappings decision lists + structured conflicts; JSON-safe)'
    preconditions: 'index entries carry header sizes; metadata document on the
      index (datasheet/embedded/explicit) or a readable standalone document'
    errors: unreadable metadata
    example: 'scans = load_data("data_netcdf/"); summary = inspect_experiment(scans);
      summary.gold'
    side_effects: read-only classification; writes nothing; never loads data blocks
  plot_batch:
    export: peaksMCP.overrides.plot_batch
    exposure: facade
    aliases:
    - "publication grid"
    - "publication figure set"
    - "batch plotting"
    - "batch grid"
    - "plot batch"
    - "batch figures"
    - "论文配图"
    - "发表级图组"
    - "批量画图"
    - "批量绘图"
    - "批量图"
    summary: Deterministic inline grid of matplotlib figures for a list of DataArrays.
    inputs:
      - {name: data, type: 'sequence of 1D/2D DataArray', required: true}
      - {name: titles, type: 'sequence[str] | None', required: false, default: null}
      - {name: max_cols, type: int, required: false, default: 5}
      - {name: max_panels_per_figure, type: int, required: false, default: 20}
      - {name: sharex, type: bool, required: false, default: false}
      - {name: sharey, type: bool, required: false, default: false}
      - {name: shared_units, type: bool, required: false, default: true}
      - {name: shared_colorbar, type: "bool | 'auto'", required: false, default: "'auto'"}
      - {name: figsize_per_panel, type: 'tuple[float, float]', required: false, default: '(4.0, 3.5)'}
      - {name: dpi, type: int, required: false, default: 180}
      - {name: cmap, type: str, required: false, default: "'viridis'"}
      - {name: plot_kwargs, type: 'mapping passthrough', required: false, note: '**kwargs forwarded to the panel plot'}
    returns: list of matplotlib Figure (rendered inline in the notebook)
    preconditions: arrays are 1D/2D; a shared colorbar needs matching intensity units
    errors: shared_colorbar=True with incompatible units or ranges; titles length
      mismatch
    example: figures = plot_batch([scan_20K, scan_40K], max_cols=2)
    side_effects: 'renders inline matplotlib figures in the notebook; never writes
      image files (persist figures with save_with_consent)'
  plot_validation_pair:
    export: peaksMCP.overrides.plot_validation_pair
    exposure: facade
    aliases:
    - "before after validation"
    - "raw vs k-space"
    - "raw vs kx"
    - "cut validation"
    - "validate cut"
    - "处理前后对比"
    - "对比图"
    - "验证图"
    - "单条验证"
    summary: 'Inline before/after figure for one cut: raw angle-space vs processed
      k-space.'
    inputs:
      - {name: raw, type: 'DataArray (eV + one other dim)', required: true}
      - {name: processed, type: 'DataArray (k-space: eV + kx)', required: true}
      - {name: title_raw, type: str, required: false, default: "'raw (θ)'"}
      - {name: title_processed, type: str, required: false, default: "'k-space (E − E_F)'"}
      - {name: ylabel, type: str, required: false, default: "'eV'"}
      - {name: figsize, type: 'tuple[float, float]', required: false, default: '(9.0, 4.5)'}
      - {name: dpi, type: int, required: false, default: 180}
      - {name: cmap, type: str, required: false, default: "'viridis'"}
      - {name: shared_scale, type: "bool | 'auto'", required: false, default: "'auto'"}
      - {name: share_energy_axis, type: 'bool | None', required: false, default: null}
      - {name: ef_line, type: bool, required: false, default: true}
      - {name: colorbar_label, type: str, required: false, default: "'counts'"}
    returns: matplotlib Figure (rendered inline in the notebook)
    preconditions: both arrays are 2D with an eV dimension
    errors: not 2D or missing eV; explicit shared_scale=True on incompatible inputs
    example: fig = plot_validation_pair(raw_cut, kspace_cut)
    side_effects: 'renders one inline matplotlib figure in the notebook; never
      writes image files (persist with save_with_consent)'
  show_mapping_slice:
    export: peaksMCP.overrides.show_mapping_slice
    exposure: facade
    aliases:
    - "mapping slice"
    - "slice of mapping"
    - "constant energy map"
    - "map slice"
    - "energy map"
    - "切片图"
    - "mapping切片"
    - "mapping切片图"
    - "固定能层图"
    - "展示mapping"
    summary: Render one slice of a mapping DataArray and print a one-line report.
    inputs:
      - {name: data, type: 'DataArray with >=2 dims', required: true, note: 'a mapping cube or any multi-dim array'}
      - {name: dim, type: str, required: true, note: 'dimension to slice along'}
      - {name: index, type: "int | 'middle'", required: false, default: "'middle'"}
      - {name: title, type: 'str | None', required: false, default: null}
      - {name: cmap, type: str, required: false, default: "'viridis'"}
      - {name: debug, type: bool, required: false, default: false}
    returns: dict {status, verb, slice, figure} - the figure renders inline for the
      user
    preconditions: data has >=2 dims and no empty dims; slicing leaves at most 2 dims
    errors: ndim<2; empty dimensions; unknown dim; slicing leaves >2 dims
    example: show_mapping_slice(mapping, dim='eV', index=0)
    side_effects: 'prints a one-line report and renders one inline figure; never
      writes files'
