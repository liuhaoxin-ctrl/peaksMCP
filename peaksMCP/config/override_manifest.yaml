version: 3
# peaksMCP project API manifest - the audited black-box exposure record.
#
# Split from the retired config/manifest.yaml.  Entries with `project: true`
# make discovery flag an API as project-added (this block doubles as the
# audited exposure record: adding a public function to peaksMCP without a
# row here fails the tests).  The `project:` block below carries the v3
# strict facade contracts (export/exposure/category/kind/summary/inputs/
# returns/preconditions/errors/example/stability) for the
# peaksMCP.overrides surface.  Upstream native presentation lives in
# config/native_catalog.yaml.
apis:
  # ========================================================= project-added
  # Everything below ships with peaksMCP. `project: true` is what makes the
  # index flag an entry, so this block doubles as the audited exposure record:
  # adding a public function to peaksMCP without a row here fails the tests.

  # --- loading and saving (unified facades; the PXT reader itself is
  # internal: peaksMCP.pxt_utils.loader is hidden from the index) ---
  load_data:
    module: peaksMCP.overrides.load
    project: true
    exposure: facade
    aliases:
      - load data
      - load dataset
      - read dataset
      - open dataset
      - open data
      - read data
      - load a file
      - load data file
      - data file
      - load pxt
      - read pxt
      - open pxt
      - pxt file
      - load raw scan
      - open raw scan
      - 加载
      - 读取
      - 加载数据
      - 读取数据
      - 打开数据
      - 加载PXT
      - 读取PXT
      - 打开PXT
    docstring_note: |
      Unified loading entry: opens one data file as a DataArray — a NetCDF
      (converted from PXT, full peaks geometry) or a raw PXT read for
      inspection. Returns the array in the variable; it never writes to disk.
  save_result:
    module: peaksMCP.overrides.save
    project: true
    exposure: facade
    aliases:
      - save result
      - save output
      - write result
      - write data
      - write output
      - write the data out
      - export result
      - persist
      - persist result
      - save to file
      - save to disk
      - write to file
      - write to disk
      - save file
      - store result
      - 保存
      - 导出
      - 保存结果
      - 导出结果
      - 写入文件
      - 落盘
    docstring_note: |
      Save facade with the preview -> consent flow. The first call only shows
      what would be written (path, kind, size, shape) and writes nothing;
      repeating it with approve=True performs the atomic write, and
      overwrite=True is required when the target already exists. Use this for
      every result the user asks to keep — analysis functions never persist
      on their own.
  convert_pxt:
    module: peaksMCP.pxt_utils.converter
    project: true
    exposure: advanced
    aliases:
      - convert pxt
      - pxt to netcdf
      - convert to netcdf
      - convert scan file
      - single file conversion
      - 转换PXT
      - PXT转NetCDF
      - 单文件转换
    docstring_note: |
      Converts a raw PXT to NetCDF. Idempotent: if the target .nc already
      exists it is skipped automatically (force=True overwrites). Always run this
      as the first step before analysis of a raw scan — it is a prerequisite
      transform, NOT a saved result, so it does not require save consent.
  convert_path:
    module: peaksMCP.pxt_utils.converter
    project: true
    exposure: advanced
    aliases:
      - batch convert
      - convert directory
      - convert folder
      - convert all scans
      - 批量转换
      - 目录转换
      - 文件夹转换
    docstring_note: |
      Batch PXT -> NetCDF conversion with bounded CPU parallelism. Each file is
      converted idempotently (skips any .nc that already exists). Run this once
      before processing a folder of raw scans; it is a prerequisite transform,
      not a saved result.
  translate_datasheet:
    module: peaksMCP.pxt_utils.csv_translator
    project: true
    exposure: advanced
    aliases:
      - datasheet translation
      - translate csv
      - datasheet to metadata
      - parse datasheet
      - 数据表翻译
      - datasheet转换

  # --- PXT metadata ---
  read_meta:
    module: peaksMCP.pxt_utils.metadata
    project: true
    exposure: advanced
    aliases:
      - load experiment metadata
      - read experiment metadata
      - metadata json
      - experiment record table
      - 加载元数据
      - 读取实验记录
      - 实验记录表
      - summarize sweeps
      - list records
      - sweep classification
      - experiment summary
      - experiment records
      - read metadata
      - 汇总记录
      - 实验记录
      - 数据清单
      - 读元数据
  classify_data_format:
    module: peaksMCP.pxt_utils.metadata
    project: true
    exposure: advanced
    aliases:
      - classify format
      - data format
      - format detection
      - sweep or fix
      - 格式判定
      - 数据格式分类
  is_gold_format:
    module: peaksMCP.pxt_utils.metadata
    project: true
    exposure: advanced
    aliases:
      - gold format
      - is gold
      - gold reference check
      - 金数据判定
      - 是否金数据
  theta_offset_deg:
    module: peaksMCP.pxt_utils.metadata
    project: true
    exposure: advanced
    aliases:
      - theta offset
      - angle offset
      - high symmetry offset
      - 角度偏移
      - 高对称点偏移

  # --- plotting and workflows ---
  plot_batch:
    module: peaksMCP.plotting.layout
    project: true
    exposure: facade
    aliases:
      - publication grid
      - paper figure grid
      - publication figure set
      - 论文配图
      - 发表级图组
      - batch plotting
      - plot batch
      - batch figures
      - batch grid
      - 批量画图
      - 批量画谱图
      - 批量绘图
      - 批量图
    docstring_note: |
      Inline grid of matplotlib figures for a list of DataArrays.
  plot_validation_pair:
    module: peaksMCP.plotting.validation
    project: true
    exposure: facade
    aliases:
      - before after validation
      - before-after pair
      - raw vs k-space
      - raw vs kx
      - validate cut
      - cut validation
      - 处理前后对比
      - 验证图
      - 单条验证
    docstring_note: |
      Inline before/after figure for one cut: raw angle-space vs processed
      k-space.
  show_mapping_slice:
    module: peaksMCP.workflows.slice_view
    project: true
    exposure: facade
    aliases:
      - mapping slice
      - slice of mapping
      - energy map
      - map slice
      - constant energy map
      - 切片图
      - mapping切片
      - mapping切片图
      - 展示mapping
      - 固定能层图
  validate_arpes_metadata:
    module: peaksMCP.workflows.publication
    project: true
    exposure: advanced
    aliases:
      - validate metadata
      - arpes metadata check
      - metadata validation
      - 元数据校验
      - ARPES元数据检查

  # --- task-level facades ---
  convert_experiment:
    module: peaksMCP.overrides.conversion
    project: true
    exposure: facade
    category: ingestion
    kind: converter
    aliases:
      - convert experiment
      - convert scans
      - convert file or folder
      - convert experiment folder
      - single or batch conversion
      - PXT转换
      - 转换实验
      - 转换文件或目录
    docstring_note: |
      Unified conversion: one PXT file or a whole folder goes through the same
      CPU-budgeted, failure-isolated path. Returns a ConversionReport with
      per-item status, output_exists, errors and CPU statistics; outputs are
      written atomically, sources are never modified. Idempotent per file
      (skips an existing .nc unless force=True).
  inspect_experiment:
    module: peaksMCP.overrides.inspection
    project: true
    exposure: facade
    category: metadata
    kind: inspector
    aliases:
      - inspect experiment
      - experiment summary
      - list scans and kinds
      - scan classification
      - summarize experiment records
      - 检查实验
      - 实验概览
      - 扫描分类
    docstring_note: |
      Structured summary of the experiment metadata document: per-record
      ScanKind, dims (when the scans are supplied), energy window, theta
      offset and polarisation, plus classification conflicts when the declared
      Data format does not match the real shape (e.g. a 3-D cube labelled
      sweep). Use it before choosing preprocess_cut vs preprocess_mapping.
  fit_gold_reference:
    module: peaksMCP.overrides.calibration
    project: true
    exposure: facade
    category: calibration
    kind: calibrator
    aliases:
      - fit gold reference
      - calibrate fermi level
      - gold calibration
      - fermi edge fit
      - EF calibration
      - 金标定
      - 费米边拟合标定
      - 拟合金数据
    docstring_note: |
      Fit the Fermi edge of one finite gold scan through peaks' own fit
      (runs exactly once). Returns a JSON-safe GoldCalibration carrying the
      EF correction (float or c0..cN dict), quality, average resolution and
      accuracy; the diagnostic figure renders inline for the user. Apply it
      with preprocess_cut / preprocess_mapping — never re-fit per cut.
  preprocess_cut:
    module: peaksMCP.overrides.preprocess
    project: true
    exposure: facade
    category: preprocessing
    kind: transformer
    aliases:
      - preprocess cut
      - flatten cut
      - level cut
      - process sweep
      - cut to kx
      - convert cut to k space
      - 预处理切片
      - 切片k空间转换
      - 切片预处理
    docstring_note: |
      Flatten the Fermi edge of one 2-D (eV, theta_par) cut and convert it to
      binding-energy (eV, kx). Accepts a GoldCalibration (or raw EF
      correction) plus the high-symmetry theta_par offset; the input array is
      never modified. 3-D data belongs to preprocess_mapping.
  preprocess_mapping:
    module: peaksMCP.overrides.preprocess
    project: true
    exposure: facade
    category: preprocessing
    kind: transformer
    aliases:
      - preprocess mapping
      - process mapping cube
      - mapping to k space
      - kx ky conversion
      - process 3d scan
      - 预处理面图
      - 面图k空间转换
      - 三维扫描处理
    docstring_note: |
      Flatten the Fermi edge of a full 3-D mapping cube (never a centre
      slice) and convert it with k_convert, producing eV/kx/ky dimensions.
      Requires normal-emission reference angles and a GoldCalibration.
      Result dims order varies by geometry — select by dimension name.
  preprocess_batch:
    module: peaksMCP.overrides.batch_preprocess
    project: true
    exposure: facade
    category: batch
    kind: batch
    aliases:
      - preprocess batch
      - batch preprocess
      - process many scans
      - process folder of scans
      - 批量预处理
      - 批量处理切片
      - 批量k空间转换
    docstring_note: |
      Path-driven batch preprocessing: each item loads, preprocesses (cut or
      mapping) and atomically saves its NetCDF under the shared CPU budget,
      one scan at a time — never the whole experiment in memory. Per-item
      statuses survive worker crashes and CPU timeouts. The per-item writes
      are batch-task outputs of a user-requested run (like conversion), not
      model-initiated result saves.

  # --- batch execution ---

project:
  - name: load_data
    export: peaksMCP.overrides.load_data
    exposure: facade
    category: ingestion
    kind: loader
    summary: Open one PXT or NetCDF file as a peaks DataArray.
    inputs: "source: path; lazy: bool=True; metadata: optional path/dict"
    returns: "peaks DataArray"
    preconditions: "one file; file exists; suffix .pxt or .nc"
    errors: "missing file; directory passed; unsupported suffix"
    example: 'data = load_data("BP_0020.nc")'
    stability: new
  - name: save_result
    export: peaksMCP.overrides.save_result
    exposure: facade
    category: persistence
    kind: serializer
    summary: Preview, then atomically save a result with user approval.
    inputs: "data; path; overwrite: bool=False; approve: bool=False"
    returns: "SaveReport (awaiting_consent by default; saved after approve=True)"
    preconditions: "approve=True only after the preview was shown and the user agreed"
    errors: "target exists without overwrite; unsupported type"
    example: 'save_result(data, "out.nc")  # preview only'
    stability: new
  - name: convert_experiment
    export: peaksMCP.overrides.convert_experiment
    exposure: facade
    category: ingestion
    kind: converter
    summary: Convert one PXT file or a whole folder to NetCDF with bounded CPU parallelism.
    inputs: "source: file or directory; output_dir; metadata; match: str=''; force: bool=False; cpu_limit_percent: float=60"
    returns: "ConversionReport (per-item status/output_exists/errors + cpu stats)"
    preconditions: "source exists; metadata exists when given"
    errors: "source not found; metadata file not found"
    example: 'report = convert_experiment("raw/", match="BP_")'
    stability: new
  - name: inspect_experiment
    export: peaksMCP.overrides.inspect_experiment
    exposure: facade
    category: metadata
    kind: inspector
    summary: Structured per-record summary of an experiment metadata document with conflicts.
    inputs: "metadata: path/dict/DataArray; scans: optional dict index->DataArray"
    returns: "ExperimentSummary (records with ScanKind/dims/windows + conflicts)"
    preconditions: "metadata readable; scans keyed by record index"
    errors: "unreadable metadata"
    example: 'summary = inspect_experiment("experiment_metadata.json", scans=loaded)'
    stability: new
  - name: fit_gold_reference
    export: peaksMCP.overrides.fit_gold_reference
    exposure: facade
    category: calibration
    kind: calibrator
    summary: Fit the Fermi edge of a finite gold scan once and return a JSON-safe calibration.
    inputs: "gold: finite 1D/2D DataArray with eV; correction: str='poly4'; outlier_exclusion: bool=True; outlier_sigma: float=3.0; plot: bool=True"
    returns: "GoldCalibration (correction, quality, resolution, rendered)"
    preconditions: "finite values; eV dimension; ndim <= 2"
    errors: "non-finite/empty data; unusable fit (no EF_correction)"
    example: 'cal = fit_gold_reference(gold); preprocess_cut(cut, calibration=cal, theta_par_offset_deg=1.5)'
    stability: new
  - name: preprocess_cut
    export: peaksMCP.overrides.preprocess_cut
    exposure: facade
    category: preprocessing
    kind: transformer
    summary: EF-flatten one 2-D (eV, theta_par) cut into binding-energy (eV, kx).
    inputs: "cut: 2D (eV, theta_par); calibration: GoldCalibration/float/dict; theta_par_offset_deg: float; eV/kx: slice=None; quiet: bool=True"
    returns: "ProcessingResult (data in notebook + JSON-safe ProcessingReport)"
    preconditions: "2D with eV and theta_par; finite; calibration and offset given"
    errors: "1D/3D input; missing eV/theta_par; non-finite; missing calibration/offset"
    example: 'out = preprocess_cut(cut, calibration=cal, theta_par_offset_deg=1.5)'
    stability: new
  - name: preprocess_mapping
    export: peaksMCP.overrides.preprocess_mapping
    exposure: facade
    category: preprocessing
    kind: transformer
    summary: EF-flatten a full 3-D mapping cube into eV/kx/ky (never a centre slice).
    inputs: "mapping: 3D cube; calibration; normal_emission: dict; eV/kx/ky: slice=None; quiet: bool=True"
    returns: "ProcessingResult (full converted cube + JSON-safe report)"
    preconditions: "3D with eV; finite; calibration and normal_emission given"
    errors: "non-3D input; missing eV; non-finite; missing calibration/normal_emission"
    example: 'out = preprocess_mapping(cube, calibration=cal, normal_emission={"theta_par": 0.0, "polar": 0.0})'
    stability: new
  - name: preprocess_batch
    export: peaksMCP.overrides.preprocess_batch
    exposure: facade
    category: batch
    kind: batch
    summary: Path-driven per-scan preprocessing with CPU budget and isolated failures.
    inputs: "items: list[BatchPreprocessItem]; calibration; output_dir; cpu_limit_percent: float=60; force: bool=False"
    returns: "BatchProcessingReport (per-item statuses + cpu stats)"
    preconditions: "non-empty items; sources exist; calibration given"
    errors: "empty items; missing source; invalid item kind"
    example: 'report = preprocess_batch(items, calibration=cal, output_dir="proc/")'
    stability: new
