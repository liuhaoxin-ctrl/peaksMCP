version: 4
# peaksMCP project API manifest - the model's curated black-box surface.
#
# Exactly six public adapters are registered here; every other peaksMCP
# function (metadata helpers, legacy writers, old task facades) is a private
# implementation and is NOT in this manifest.  Entries are constructed
# statically into the API index (no AST scan of peaksMCP); native peaks APIs
# are the only dynamically scanned tier.  Signatures are verified at runtime
# by importing `export`; peaks_get_api returns this structured contract.
apis:
  load_data:
    export: peaksMCP.overrides.load_data
    exposure: facade
    aliases:
    - load data
    - load dataset
    - load folder
    - load directory
    - load experiment
    - load files
    - 加载目录
    - 加载文件夹
    - 批量加载
    - read dataset
    - open dataset
    - open data
    - read data
    - load a file
    - load data file
    - data file
    - load pxt
    - read pxt
    - open pxt
    - pxt file
    - load raw scan
    - open raw scan
    - 加载
    - 读取
    - 加载数据
    - 读取数据
    - 打开数据
    - 加载PXT
    - 读取PXT
    - 打开PXT
    summary: Load any data for the agent - one file, or an identity index of a folder/list.
    inputs: 'source: one file (.pxt/.nc), a folder, or a sequence of paths; lazy:
      bool=True; metadata: optional path/dict'
    returns: 'peaks DataArray (one file) or LoadedScans (folder/sequence: identity
      index - stem/path/representation/sizes/metadata provenance + scans[stem] data
      layer; no classification)'
    preconditions: path(s) exist; folder contains supported files
    errors: missing path; unsupported suffix; empty folder/sequence
    example: scans = load_data("data/"); summary = inspect_experiment(scans); cut = scans["BP_0015"]
  convert_experiment:
    export: peaksMCP.overrides.convert_experiment
    exposure: facade
    aliases:
    - convert experiment
    - convert scans
    - convert file or folder
    - convert experiment folder
    - single or batch conversion
    - PXT转换
    - 转换实验
    - 转换文件或目录
    summary: Convert one PXT file or a whole folder to NetCDF with bounded CPU parallelism.
    inputs: 'source: file or directory; output_dir; metadata; match: str=''''; force:
      bool=False; cpu_limit_percent: float=60'
    returns: ConversionReport (per-item status/output_exists/errors + cpu stats)
    preconditions: source exists; metadata exists when given
    errors: source not found; metadata file not found
    example: report = convert_experiment("raw/", match="BP_")
    side_effects: persists converted NetCDF files and the translated experiment_metadata.json
      ONLY after human approval on the conversion consent card
  inspect_experiment:
    export: peaksMCP.overrides.inspect_experiment
    exposure: facade
    aliases:
    - inspect experiment
    - experiment summary
    - list scans and kinds
    - scan classification
    - summarize experiment records
    - 检查实验
    - 实验概览
    - 扫描分类
    summary: 'Classify one experiment: per-record ScanKind, decision lists and
      shape conflicts (the single classification owner).'
    inputs: 'scans: LoadedScans from load_data (primary form); standalone documents
      also accepted: metadata path/dict/DataArray with optional scans= dict of
      index->DataArray'
    returns: 'ExperimentSummary (records with ScanKind/dims/energy windows +
      gold/cuts/mappings decision lists + structured conflicts; JSON-safe)'
    preconditions: 'index entries carry header sizes; metadata document on the
      index (datasheet/embedded/explicit) or a readable standalone document'
    errors: unreadable metadata
    example: 'scans = load_data("data_netcdf/"); summary = inspect_experiment(scans);
      summary.gold' 
  plot_batch:
    export: peaksMCP.overrides.plot_batch
    exposure: facade
    aliases:
    - publication grid
    - paper figure grid
    - publication figure set
    - 论文配图
    - 发表级图组
    - batch plotting
    - plot batch
    - batch figures
    - batch grid
    - 批量画图
    - 批量画谱图
    - 批量绘图
    - 批量图
    summary: Deterministic inline grid of matplotlib figures for a list of DataArrays.
    inputs: 'items: sequence of 1D/2D xarray.DataArray; max_cols=5; shared_colorbar=''auto''|True|False;
      titles/figsize/dpi optional'
    returns: list of matplotlib Figure (rendered inline in the notebook)
    preconditions: arrays are 1D/2D; a shared colorbar needs matching intensity units
    errors: shared_colorbar=True with incompatible units or ranges; titles length
      mismatch
    example: figures = plot_batch([scan_20K, scan_40K], max_cols=2)
  plot_validation_pair:
    export: peaksMCP.overrides.plot_validation_pair
    exposure: facade
    aliases:
    - before after validation
    - before-after pair
    - raw vs k-space
    - raw vs kx
    - validate cut
    - cut validation
    - 处理前后对比
    - 验证图
    - 单条验证
    summary: 'Inline before/after figure for one cut: raw angle-space vs processed
      k-space.'
    inputs: 'raw/processed: 2D xarray.DataArray with eV + one other dim; shared_scale=''auto''|True|False;
      share_energy_axis optional; ef_line=True'
    returns: matplotlib Figure (rendered inline in the notebook)
    preconditions: both arrays are 2D with an eV dimension
    errors: not 2D or missing eV; explicit shared_scale=True on incompatible inputs
    example: fig = plot_validation_pair(raw_cut, kspace_cut)
  show_mapping_slice:
    export: peaksMCP.overrides.show_mapping_slice
    exposure: facade
    aliases:
    - mapping slice
    - slice of mapping
    - energy map
    - map slice
    - constant energy map
    - 切片图
    - mapping切片
    - mapping切片图
    - 展示mapping
    - 固定能层图
    summary: Render one slice of a mapping DataArray and print a one-line report.
    inputs: 'data: mapping with >=2 dims; dim: str; index=''middle''|int; cmap=''viridis'';
      debug=False'
    returns: dict {status, verb, slice, figure} - the figure renders inline for the
      user
    preconditions: data has >=2 dims and no empty dims; slicing leaves at most 2 dims
    errors: ndim<2; empty dimensions; unknown dim; slicing leaves >2 dims
    example: show_mapping_slice(mapping, dim='eV', index=0)
