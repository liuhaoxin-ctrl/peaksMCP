version: 1
tools:
  search:
    title: Search Peaks API
    description: >
      MUST be called before writing any Peaks analysis code. Search is
      two-tier and override-first: the peaksMCP override APIs (this project's
      high-level verbs) are searched first and returned alone whenever the
      query hits one of them by exact name or alias; only when no override
      fits does search fall back to the native peaks API index. Each response
      reports searched_namespace ("override" | "mixed"), match_mode
      (exact_name | exact_alias | fuzzy | list) and a score per hit. Rows are
      deliberately compact and black-box: canonical id, name, tier, exposure
      and a one-line summary - never docstrings, aliases or source paths.
      Call get with the returned canonical id for the full contract.
  get:
    title: Get Peaks API
    description: >
      Get details for ONE canonical API ID returned by search - no other
      input form is accepted (bare names and aliases are refused; search
      first). Returns the runtime-verified signature and the structured
      contract (inputs/returns/preconditions/side_effects/errors/example)
      for override APIs; never source paths. A successful get also records
      the canonical proof in the run ledger: run_cell executes an exact-name
      Peaks call only after its canonical id was fetched here with a
      matching scope.
  inspect_notebook:
    title: Inspect Notebook
    description: >
      Inspect the live notebook through the generic object-summary protocol
      (bounded; raw cell outputs are NEVER returned - they travel exactly
      once, settled inside the run_cell reply). target discriminates:
      "variables" (namespace rows), "variable" (one named variable - pass
      variable_name), "active_cell" (current cell identity/source metadata),
      "cells" (bounded trailing notebook history - tail + pagination via
      limit/offset) or "cell" (one cell by id or index - pass cell). detail
      selects "summary" (one bounded line per item) or "preview"
      (structural detail: xarray dims/sizes/dtype/units/lazy state,
      LoadedScans-like indices report representation counts and conversion
      state - never classification, which belongs to inspect_experiment;
      bounded sources for history rows).
  run_cell:
    title: Run Cell
    description: >
      Write model-generated code to a NEW cell at the END of the notebook and
      execute it (append-only log: cells are never edited, deleted or
      reordered). Every Peaks API reference is verified against the live
      index; canonical-API proof is a HARD gate: an exact-name Peaks call
      runs only after its canonical id was fetched with get this session
      (scope must match; pass api_ids to declare the ids this cell relies
      on). run_cell is NEVER a persistence path: cells that write files
      (savefig / writers / unclear file modes) are hard-blocked - persist
      results with save_with_consent and PXT conversion with
      convert_experiment. Returns the executed cell identity plus a
      normalised output list (errors, figure markers); text stays in the
      notebook as the shared record.
  save_with_consent:
    title: Save Variable With Consent
    description: >
      Persist ONE live notebook variable (or matplotlib figure) to a file -
      the single persistence verb. A record cell showing the normalized
      preview is appended first, the exact bytes are staged in a unified
      server-owned temp area (strict TTL, no code-level approve), the save
      consent card asks for approval, and only an affirmative decision
      atomically publishes. Returns a SaveReceipt: operation / status
      (saved | denied | blocked | failed) / path / kind / size_bytes /
      sha256 / dims / dtype / units / overwrite / ticket_id. Targets: xarray
      DataArray/Dataset (.nc), dict/list (.json), matplotlib Figure
      (.png/.svg/.pdf/.jpg). One variable, one file, per call. overwrite=True
      only permits replacing an existing target AFTER approval.
