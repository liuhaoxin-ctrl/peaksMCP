version: 1
tools:
  peaks_search_api:
    title: Search Peaks API
    description: >
      MUST be called before writing any Peaks analysis code. Search is
      two-tier and override-first: the peaksMCP override APIs (this project's
      high-level verbs) are searched first and returned alone whenever the
      query hits one of them by exact name or alias; only when no override
      fits does search fall back to the native peaks API index. Each response
      reports searched_namespace ("override" | "mixed"), match_mode
      (exact_name | exact_alias | fuzzy | list) and a score per hit. Rows are
      deliberately compact and black-box: canonical id, name, tier, exposure
      and a one-line summary - never docstrings, aliases or source paths.
      Call peaks_get_api with the returned canonical id for details.
  peaks_get_api:
    title: Get Peaks API
    description: >
      Get details for ONE canonical API ID returned by peaks_search_api -
      no other input form is accepted (bare names, aliases and legacy ids
      are refused; search first). Returns the signature (and bound accessor
      signature), tier/exposure and a bounded docstring. Both override and
      native APIs are black-box here: no source paths, aliases or internal
      fields are ever returned. Call this after searching and before writing
      code, to confirm the correct usage.
  askuserquestion:
    title: Ask User Question
    description: >
      Report missing experimental information/essential information to the conversation.
      Returns {"status": "needs_input", ...} — the caller should then ask the user in the
      conversation. options MUST be a plain list of strings (e.g. ["S", "P"]) — NOT a
      list of objects. NEVER invent missing physical values (Fermi level, angle
      conventions, polarization, temperature); ask instead.
  notebook_list_variables:
    title: List Notebook Variables
    description: List useful variables in the live kernel without reading array values.
  inspect_notebook:
    title: Inspect Notebook
    description: >
      Inspect the live notebook through the generic object-summary protocol.
      target discriminates the request: "variables" (namespace listing rows),
      "variable" (one named variable - pass variable_name) or "active_cell"
      (the currently selected JupyterLab cell). detail selects "summary"
      (one bounded line per item) or "preview" (structural detail: xarray
      dims/sizes/dtype/units/lazy state; LoadedScans-like indices report
      representation counts, conversion state and metadata provenance -
      never classification, which belongs to inspect_experiment; other
      objects get bounded reprs). limit caps variable rows (1..50).
      All outputs are bounded - nothing unbounded reaches the model.
  notebook_read_variable:
    title: Read Notebook Variable
    description: Summarize a variable; xarray results include dims, coordinates, units, attrs, chunks and Peaks accessors.
  notebook_read_active_cell:
    title: Read Active Cell
    description: >
      Read the source and identity of the currently selected JupyterLab cell.
      Raw cell outputs are normalised into an ``output`` list (errors, the
      "Inline figure rendered ..." line, interactive markers); text-only
      outputs are not echoed — they are displayed in the notebook for the user.
  notebook_server_status:
    title: MCP Server Status
    description: Return mode, API-index and Comm-bridge readiness for this kernel MCP server.
  notebook_write_with_api_check:
    title: Write Code With API Check
    description: >
      Write model-generated code to a new notebook cell, execute it, and automatically
      verify every Peaks API reference against the live API index. Returns the executed
      cell identity plus a normalised ``output`` list: errors and the "Inline figure
      rendered ..." line are echoed; text-only outputs are intentionally not echoed
      (they are displayed in the notebook for the user). Writing files or saving
      figures always asks for your approval in the notebook before the cell runs.
      RULE: only use non-Peaks functions when Peaks has no corresponding API.
      ALL model-generated Peaks analysis code MUST be written through this tool.
  notebook_add_cell:
    title: Add Notebook Cell
    description: >
      Append a code, Markdown or raw cell to the END of the notebook. The
      notebook is a strictly append-only log: cells can never be edited,
      deleted or reordered, so the agent's work history is preserved top to
      bottom. Mutation tool: always scanner-checked and audit-logged; when
      mcp.require_consent is enabled the user first approves it.
