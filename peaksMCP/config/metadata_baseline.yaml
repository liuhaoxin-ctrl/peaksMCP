version: 1
tools:
  peaks_search_api:
    title: Search Peaks API
    description: >
      MUST be called before writing any Peaks analysis code. Search the live Peaks
      API index for the user's intent. Do NOT write or guess Peaks code from memory
      without first querying this tool. Returns canonical API ids, names and
      one-line summaries.
  peaks_get_api:
    title: Get Peaks API
    description: >
      Get the exact signature, parameters, return-value conventions and source-backed
      documentation for one canonical API ID returned by peaks_search_api. Call this
      after searching and before writing code, to confirm the correct usage.
  mcp_list_resources:
    title: List Plot Resources
    description: >
      Discover the canonical publication plotting formats before drawing a figure.
      Returns every resource with its uri, when-to-use and a usage example, plus
      guidance on when to fetch a template (resources/read, peaksmcp://plot/<id>)
      versus using tools. Call this FIRST when a figure is needed.
  askuserquestion:
    title: Ask User Question
    description: >
      Report missing experimental information/essential information to the conversation.
      Returns {"status": "needs_input", ...} — the caller should then ask the user in the
      conversation. options MUST be a plain list of strings (e.g. ["S", "P"]) — NOT a
      list of objects. NEVER invent missing physical values (Fermi level, angle
      conventions, polarization, temperature); ask instead.
  notebook_list_variables:
    title: List Notebook Variables
    description: List useful variables in the live kernel without reading array values.
  notebook_read_variable:
    title: Read Notebook Variable
    description: Summarize a variable; xarray results include dims, coordinates, units, attrs, chunks and Peaks accessors.
  notebook_read_active_cell:
    title: Read Active Cell
    description: Read the source and identity of the currently selected JupyterLab cell.
  notebook_read_active_cell_output:
    title: Read Active Cell Output
    description: Read text and inline image outputs from the current cell.
  notebook_read_content:
    title: Read Notebook Content
    description: Read the current notebook cell structure through the JupyterLab Comm bridge.
  notebook_move_cursor:
    title: Move Notebook Cursor
    description: Select the previous, next or numbered notebook cell.
  notebook_server_status:
    title: MCP Server Status
    description: Return mode, API-index and Comm-bridge readiness for this kernel MCP server.
  notebook_kernel_status:
    title: Kernel Status
    description: Return the kernel busy or idle state and busy start time.
  notebook_wait_for_kernel:
    title: Wait for Kernel
    description: Wait for the current kernel to become idle up to a bounded timeout.
  notebook_write_with_api_check:
    title: Write Code With API Check
    description: >
      Write model-generated code to a new notebook cell, execute it, and automatically
      verify every Peaks API reference against the live API index. Returns
      verified_peaks_apis (names resolved to Peaks APIs) and generic_refs (names
      with no Peaks counterpart). RULE: only use non-Peaks functions when Peaks
      has no corresponding API. ALL model-generated Peaks analysis code MUST be
      written through this tool.
  notebook_add_cell:
    title: Add Notebook Cell
    description: >
      Append a code, Markdown or raw cell to the END of the notebook. The
      notebook is a strictly append-only log: cells can never be edited,
      deleted or reordered, so the agent's work history is preserved top to
      bottom. Mutation tool: always scanner-checked and audit-logged; when
      mcp.require_consent is enabled the user first approves it.

# Canonical publication plotting formats. The agent selects one by id and uses
# its `template` verbatim (adjusted variable names); `figure` documents the
# styling contract (axes, colorbar, dpi) a valid result must satisfy.
resources:
  fermi_surface:
    title: Fermi surface map (kx–ky at E_F)
    when_to_use: 2D (kx, ky) slice at the Fermi level from a 3D Fermi-surface
      map or mapping — symmetric square axes, one shared colorbar.
    figure:
      aspect: square
      figsize_in: [5.0, 5.0]
      dpi: 200
      cmap: magma
      colorbar: single shared
    example: 'plot_batch([fs], figsize_per_panel=(5.0, 5.0), dpi=200, cmap="magma", shared_colorbar=True)'
    template: |
      from peaksMCP.plotting import plot_batch
      # fs: 2D (kx, ky) DataArray taken at E = E_F (binding energy 0)
      figs = plot_batch([fs], figsize_per_panel=(5.0, 5.0), dpi=200,
                        cmap="magma", shared_colorbar=True)

  dispersion_single:
    title: Single dispersion (E–E_F vs k_∥)
    when_to_use: One 2D cut in binding energy after k-conversion — manual axes
      for full control; Fermi level must sit at E = 0 with a dashed guide.
    figure:
      figsize_in: [4.5, 5.0]
      dpi: 200
      cmap: viridis
      ylabel: E − E_F (eV)
      xlabel: k_∥ (Å^-1)
      guide: dashed horizontal line at E = 0
    example: 'fig, ax = plt.subplots(figsize=(4.5, 5.0), dpi=200); ax.pcolormesh(k.values, cut.eV.values, cut.values, vmin=0, vmax=v, shading="auto")'
    template: |
      import matplotlib.pyplot as plt, numpy as np
      # cut: 2D (eV, k_par) DataArray in binding energy (E_F = 0)
      k = cut.kx if "kx" in cut.dims else cut[list(set(cut.dims) - {"eV"})[0]]
      v = np.nanpercentile(cut.values, 99)
      fig, ax = plt.subplots(figsize=(4.5, 5.0), dpi=200)
      ax.pcolormesh(k.values, cut.eV.values, cut.values, vmin=0, vmax=v,
                    cmap="viridis", shading="auto")
      ax.axhline(0, color="w", ls="--", lw=0.6)
      ax.set_xlabel("k$_{∥}$ (Å$^{-1}$)")
      ax.set_ylabel("E − E$_F$ (eV)")
      fig.colorbar(ax.images[-1], ax=ax, label="intensity")

  dispersion_grid:
    title: Grid of dispersions (batch E–k cuts)
    when_to_use: Many 2D cuts to compare (e.g. all sweep records) — shared
      color scale and per-panel titles carrying the index and polarization.
    figure:
      max_cols: 4
      figsize_per_panel_in: [3.5, 3.2]
      dpi: 160
      cmap: magma
      colorbar: shared
      panel_title: Index + polarization
    example: 'plot_batch(cuts, titles=titles, max_cols=4, figsize_per_panel=(3.5, 3.2), dpi=160, cmap="magma", shared_colorbar=True)'
    template: |
      from peaksMCP.plotting import plot_batch
      # cuts: list of 2D (eV, k_par) DataArrays; titles: same length, e.g.
      # [f"Idx {i}  pol={pol}"] for the index i and its polarization
      figs = plot_batch(cuts, titles=titles, max_cols=4,
                        figsize_per_panel=(3.5, 3.2), dpi=160,
                        cmap="magma", shared_colorbar=True)

  waterfall:
    title: Waterfall of MDC / EDC curves
    when_to_use: Stacked 1D distribution curves (MDCs across energy, EDCs across
      momentum, temperature series) — offset each trace, colour by position.
    figure:
      figsize_in: [6.0, 4.5]
      dpi: 180
      cmap: viridis
      offset: 10% of each curve max
    example: 'for i, c in enumerate(curves): ax.plot(c.coords[axis].values, c.values + off, color=plt.cm.viridis(i / max(len(curves) - 1, 1)))'
    template: |
      import matplotlib.pyplot as plt, numpy as np
      # curves: list of 1D DataArray; axis = curves[0]'s sole dimension name
      axis = list(curves[0].dims)[0]
      fig, ax = plt.subplots(figsize=(6.0, 4.5), dpi=180)
      off = 0.0
      for i, c in enumerate(curves):
          ax.plot(c.coords[axis].values, c.values + off, lw=1,
                  color=plt.cm.viridis(i / max(len(curves) - 1, 1)))
          off += float(np.nanmax(c.values)) * 0.1
      ax.set_xlabel(axis)
      ax.set_ylabel("intensity + offset")

  before_after:
    title: Before / after preprocessing
    when_to_use: "Validate a cut: raw (angle domain) next to its k-converted,
      EF-corrected result on the same figure with one shared colorbar."
    figure:
      figsize_in: [9.0, 4.5]
      dpi: 180
      cmap: viridis
      panels: raw (θ) | k-space (E − E_F)
    example: 'fig, axes = plt.subplots(1, 2, figsize=(9.0, 4.5), dpi=180, sharey=True)'
    template: |
      import matplotlib.pyplot as plt, numpy as np
      # raw: 2D (eV, theta_par); processed: 2D (eV, k_par) in binding energy
      fig, axes = plt.subplots(1, 2, figsize=(9.0, 4.5), dpi=180, sharey=True)
      for ax, da, title in zip(axes, [raw, processed], ["raw (θ)", "k-space (E−E$_F$)"]):
          k = da.kx if "kx" in da.dims else da.theta_par
          v = np.nanpercentile(da.values, 99)
          im = ax.pcolormesh(k.values, da.eV.values, da.values, vmin=0, vmax=v,
                             cmap="viridis", shading="auto")
          ax.set_title(title)
          ax.set_xlabel(str(k.name)); ax.set_ylabel("eV")
      fig.colorbar(im, ax=axes, label="counts")

  kz_map:
    title: kz dispersion (hv-scan)
    when_to_use: Photon-energy scan converted to (kz, k_∥) at E − E_F — vertical
      axis is kz (Å^-1), colour the hv-derived dispersion.
    figure:
      figsize_in: [4.5, 5.0]
      dpi: 200
      cmap: magma
      ylabel: kz (Å^-1)
      colorbar: single
    example: 'ax.pcolormesh(kp.values, kzd.kz.values, kzd.values, vmin=0, vmax=v, cmap="magma", shading="auto")'
    template: |
      import matplotlib.pyplot as plt, numpy as np
      # kzd: 2D (kz, k_par) DataArray in binding energy (E_F = 0)
      kp = kzd.kx if "kx" in kzd.dims else kzd[list(set(kzd.dims) - {"kz"})[0]]
      v = np.nanpercentile(kzd.values, 99)
      fig, ax = plt.subplots(figsize=(4.5, 5.0), dpi=200)
      ax.pcolormesh(kp.values, kzd.kz.values, kzd.values, vmin=0, vmax=v,
                    cmap="magma", shading="auto")
      ax.set_xlabel("k$_{∥}$ (Å$^{-1}$)")
      ax.set_ylabel("k$_z$ (Å$^{-1}$)")
      fig.colorbar(ax.images[-1], ax=ax, label="intensity")
