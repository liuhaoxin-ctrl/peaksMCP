overrides:
  k_convert:
    docstring_note: |
      Note: ordinary angle-to-momentum conversion (k_convert) does NOT require
      photon energy (hv). The `return_kz_scan_in_hv` option is only used when
      converting photon-energy (hv) scans to out-of-plane momentum (kz); regular
      spectrum conversion needs no hv.
  fit_gold:
    docstring_note: |
      fit_gold is a PURE matplotlib routine: it returns one static multi-panel
      matplotlib Figure rendered inline in the notebook as a single image.
      It is NOT a Bokeh/holoviews/Plotly object:
      - do not pass bokeh-style options (cmap, tools, sizing_mode, ...);
      - do not claim it produces interactive widgets or that its panels can be
        recolored via a `cmap` argument.
      Confirm it ran by checking the cell output contains a rendered image
      (image/png). A lone '<Figure size ...>' text repr means the figure was
      NOT displayed — do not analyze numbers from an unrendered figure; rerun
      with the sanctioned inline-display pattern instead. Read fit results
      (e.g. EF) from the printed text/attributes of the same call, not from
      figure pixels.
  plot_validation_pair:
    docstring_note: |
      plot_validation_pair returns a matplotlib Figure (static, inline). It is
      a diagnostic pair: always state which raw input and which processed
      output the pair shows. If the cell output is only a '<Figure size ...>'
      text repr (no image), the figure was not displayed — treat it as a
      rendering fault, not as a successful validation, and rerun via the
      plotting-format template.
  plot_batch:
    docstring_note: |
      plot_batch returns matplotlib Figures rendered inline (one image per
      panel/set). Confirm each call produced rendered images in the output;
      a '<Figure ...>' text repr alone means nothing was displayed.
  disp:
    docstring_note: |
      disp is peaks' NATIVE interactive data viewer (Qt GUI windows) — the
      intended tool when the user asks for an "interactive panel" / GUI
      viewing of the data (not the static matplotlib templates).
      - Import it explicitly (it is NOT available as ``pks.disp``):
          from peaks.core.GUI.disp_panels import disp
      - Call it on loaded data: ``data.disp()``, or as a function accepting
        one DataArray, a list of 2D DataArrays or a DataTree:
        ``disp([data_6, data_12], primary_dim=...)`` shows them together
        (multiple viewers are configured via ``peaks.opts.gui.max_viewers``).
      - ``primary_dim`` picks which dimension is on the y axis (default uses
        the conventional peaks axes, eV excluded from centering); for k-space
        (eV, kx) data pass ``primary_dim='kx'``.
      - In Jupyter the Qt6 event loop is enabled automatically; in a plain
        script it blocks until the window closes.
      - The data must already be loaded in the kernel (kernel restarts clear
        variables — reload before opening).
