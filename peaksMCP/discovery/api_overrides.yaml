overrides:
  k_convert:
    docstring_note: |
      Note: ordinary angle-to-momentum conversion (k_convert) does NOT require
      photon energy (hv). The `return_kz_scan_in_hv` option is only used when
      converting photon-energy (hv) scans to out-of-plane momentum (kz); regular
      spectrum conversion needs no hv.
